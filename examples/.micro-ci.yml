# Example for this repository; commands run from the checkout root.
# Place this file at the root of a repository when configuring a pipeline.
image: golang:1.26
timeoutSeconds: 300
steps:
  - name: Download dependencies
    command: cd backend && go mod download
  - name: Test
    command: cd backend && go test ./...
  - name: Vet
    command: cd backend && go vet ./...
